    <script>
      // Tiempos de palabra de la VO (campana-toma-1.words.json) + desfase de 0,2 s con el que va colocada en la mezcla.
      const WORDS = [["¿Tus",0.2],["leads",0.44],["se",0.72],["pierden",0.84],["entre",1.28],["portales,",1.48],["WhatsApp",2.56],["y",2.92],["Excel?",3.08],["Con",3.96],["Imperios,",4.2],["todos",4.92],["entran",5.32],["en",5.64],["un",5.8],["solo",5.92],["panel,",6.2],["y",6.8],["ves",6.96],["qué",7.16],["campaña",7.32],["funciona.",7.72],["La",8.68],["inteligencia",8.76],["artificial",9.32],["cruza",9.92],["zona,",10.36],["tipo",11.0],["y",11.2],["presupuesto",11.36],["con",11.96],["tu",12.12],["cartera.",12.24],["Y",13.08],["cuando",13.2],["hay",13.48],["match,",13.72],["reactivas",14.2],["al",14.72],["cliente",14.84],["con",15.32],["una",15.48],["oportunidad",15.6],["real.",16.28],["Visitas,",17.08],["recordatorios",17.8],["y",18.56],["agentes,",18.8],["coordinados",19.44],["desde",20.04],["la",20.28],["misma",20.44],["agenda.",20.76],["Imperios.",21.68],["Todo",22.6],["conectado,",22.84],["de",23.6],["principio",23.72],["a",24.25],["fin.",24.36]];
      const KEY = new Set(["panel,", "campaña", "zona,", "tipo", "presupuesto", "real.", "agenda.", "conectado,", "fin."]);
      // Escenas: [id, inicio, fin]
      const SC = { sH: [0, 3.86], s1: [3.86, 6.72], s2: [6.72, 8.55], s3: [8.55, 12.95], s4: [12.95, 16.95], s5: [16.95, 21.55], s6: [21.55, 24.95], s7: [24.95, 28.2] };

      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";

      // Subtítulo cinético: cada palabra entra en su instante de la VO; las palabras clave llevan subrayado amarillo.
      function caption(el, from, to, words) {
        el.innerHTML = "";
        words.forEach(([txt, t]) => {
          const w = document.createElement("span");
          w.className = "w";
          w.textContent = txt;
          el.appendChild(w);
          tl.fromTo(w, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.28, ease: E }, t - 0.04);
          if (KEY.has(txt)) {
            const u = document.createElement("span");
            u.className = "ul";
            w.appendChild(u);
            tl.fromTo(u, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, t + 0.18);
          }
        });
      }
      const range = (a, b) => WORDS.filter(([, t]) => t >= a && t < b);

      // Entrada y salida de cada escena (sobre el contenedor interior, nunca sobre el .clip)
      function sceneIO(id, inDur = 0.38, outDur = 0.22) {
        const [a, b] = SC[id];
        tl.fromTo(`#${id}-in`, { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: inDur, ease: E }, a);
        if (id !== "s7") tl.to(`#${id}-in`, { opacity: 0, y: -50, duration: outDur, ease: "power2.in" }, b - outDur);
      }

      // GANCHO
      caption(document.getElementById("cap-hook"), 0, 3.86, range(0, 3.86));
      tl.fromTo("#hook-tag", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, 0.05);
      gsap.utils.toArray(".chip").forEach((c, i) => {
        tl.fromTo(c, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.5 + i * 0.32);
        tl.to(c, { y: i % 2 ? -26 : 22, rotation: i % 2 ? -4 : 3, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.8 + i * 0.05);
      });
      tl.to(".chip", { x: (i) => [430, -50, 100, 420, -150, 100][i], y: (i) => [-60, 10, -230, -380, -330, -540][i], scale: 0.2, opacity: 0, duration: 0.42, ease: "power3.in", stagger: 0.03 }, 3.38);
      tl.to("#sH-in", { opacity: 0, duration: 0.18 }, 3.68);

      // 01 · Contactos: filas de la tabla real entrando una a una
      sceneIO("s1");
      const s = 912 / 1029; // escala de las placas a 2x dentro de la tarjeta
      const table = document.getElementById("s1-table");
      const rowTop = [0, 75];
      for (let i = 1; i < 8; i++) rowTop.push(75 + i * 97.9);
      rowTop.push(857);
