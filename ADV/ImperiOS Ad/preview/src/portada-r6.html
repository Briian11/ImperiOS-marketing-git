<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada Reel — R6 Antes / después</title>
<!-- Portada 1080×1920 del Reel R6. Mismo lenguaje que el carrusel del feed «¿Cansado de saltar entre herramientas?»:
     arriba oscuro (el ANTES), corte en diagonal, abajo claro (el DESPUÉS con ImperiOS).
     Logo en blanco sobre el negro; amarillo sólido #FFD500. Todo dentro del recorte 3:4 de la cuadrícula (y 240–1680). -->
<style>
@font-face { font-family: "Manrope"; src: url("manrope-latin-variable.woff2") format("woff2"); font-weight: 200 800; }
:root { --ink-950:#0A0A0A; --ink-900:#1C1C1C; --ink-800:#333; --ink-700:#4A4A4A; --ink-600:#727272; --ink-500:#B0B0B0;
  --ink-300:#D4D4D4; --ink-200:#EBEBEB; --ink-100:#F7F7F3; --ink-50:#FAFAFA; --y:#FFD500; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body { font-family: "Manrope", sans-serif; -webkit-font-smoothing: antialiased; position: relative; background: var(--ink-100); color: var(--ink-950); }
.abs { position: absolute; }
.dark { position: absolute; left: 0; right: 0; top: 0; height: 1080px; background-color: var(--ink-950); clip-path: polygon(0 0, 100% 0, 100% 91%, 0 100%);
  background-image: linear-gradient(to right, rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 40px 40px; }
.lgrid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(10,10,10,.055) 1px, transparent 1px), linear-gradient(to bottom, rgba(10,10,10,.055) 1px, transparent 1px); background-size: 40px 40px; }
.logo { left: 96px; top: 280px; }
.logo img { display: block; height: 86px; }
.lbl { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 26px; letter-spacing: .16em; }
.lbl i { width: 40px; height: 6px; border-radius: 3px; background: var(--y); }
h1 { position: absolute; left: 92px; right: 60px; font-weight: 800; letter-spacing: -.045em; line-height: 1.0; }
h1 em { font-style: italic; font-weight: 500; }
.chip { position: absolute; padding: 14px 22px; border-radius: 14px; background: var(--ink-900); border: 1.5px solid var(--ink-800);
  font-weight: 700; font-size: 26px; color: var(--ink-500); white-space: nowrap; display: flex; align-items: center; gap: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.4); }
.chip b { display: inline-grid; place-items: center; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 16px; background: var(--y); color: var(--ink-950); font-size: 18px; }
.ok { position: absolute; padding: 14px 22px; border-radius: 14px; background: var(--ink-50); border: 1.5px solid var(--ink-200);
  font-weight: 700; font-size: 26px; display: flex; align-items: center; gap: 12px; box-shadow: 0 16px 40px rgba(10,10,10,.07); white-space: nowrap; }
.ok i { width: 14px; height: 14px; border-radius: 50%; background: var(--y); box-shadow: 0 0 0 2px var(--ink-950) inset; }
.foot { position: absolute; left: 96px; right: 96px; top: 1615px; display: flex; justify-content: space-between; font-weight: 800; font-size: 26px; letter-spacing: .16em; }
</style>
</head>
<body>
<div class="lgrid"></div>
<div class="dark"></div>

<!-- ANTES (oscuro) -->
<div class="abs logo"><img src="../../assets_in/brand-kit/assets/logo-imperios-navbar-blanco.svg" alt="ImperiOS"></div>
<div class="abs lbl" style="left:96px;top:440px;color:#fff"><i></i>ANTES</div>
<h1 style="top:500px;font-size:112px;color:#fff">Clientes que<br>se <em style="color:var(--y)">enfrían.</em></h1>
<div class="chip" style="left:96px;top:760px;transform:rotate(-4deg)">Llamada perdida<b>3</b></div>
<div class="chip" style="left:430px;top:745px;transform:rotate(3deg)">WhatsApp<b>12</b></div>
<div class="chip" style="left:720px;top:770px;transform:rotate(-2deg)">Excel</div>
<div class="chip" style="left:170px;top:855px;transform:rotate(2deg)">¿Visita… jueves?</div>
<div class="chip" style="left:520px;top:860px;transform:rotate(-5deg)">Sin responder</div>

<!-- DESPUÉS (claro) -->
<div class="abs lbl" style="left:96px;top:1120px"><i></i>DESPUÉS · CON IMPERIOS</div>
<h1 style="top:1180px;font-size:112px">Todo en un<br><em>mismo lugar.</em></h1>
<div class="ok" style="left:96px;top:1420px"><i></i>Respuesta en &lt; 1 min</div>
<div class="ok" style="left:470px;top:1420px"><i></i>Visita en agenda</div>
<div class="ok" style="left:96px;top:1496px"><i></i>Recordatorio automático</div>
<div class="ok" style="left:500px;top:1496px"><i></i>Todo centralizado</div>
<div class="foot"><span style="color:var(--ink-600)">IMPERIOS.APP</span><span>COMENTA DEMO ↗</span></div>
<script>
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => i.onload = r))));
</script>
</body>
</html>
