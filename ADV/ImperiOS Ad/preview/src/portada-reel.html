<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada Reel — gancho C</title>
<!-- Portada 1080×1920 para el Reel del gancho C. Todo lo importante va dentro del recorte 3:4 de la cuadrícula del perfil (y 240–1680).
     ?tema=claro para la variante clara; por defecto, oscura (como la plantilla vertical-portada del kit de marca). -->
<style>
@font-face { font-family: "Manrope"; src: url("manrope-latin-variable.woff2") format("woff2"); font-weight: 200 800; }
:root { --ink-950:#0A0A0A; --ink-900:#1C1C1C; --ink-800:#333; --ink-600:#727272; --ink-500:#B0B0B0; --ink-200:#EBEBEB; --ink-100:#F7F7F3; --ink-50:#FAFAFA; --y:#FFD500; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body { font-family: "Manrope", sans-serif; -webkit-font-smoothing: antialiased; position: relative;
  --bg: var(--ink-950); --fg: #fff; --sub: var(--ink-500); --chip: var(--ink-900); --chipB: var(--ink-800); --grid: rgba(255,255,255,.045);
  background: var(--bg); color: var(--fg); }
body.claro { --bg: var(--ink-100); --fg: var(--ink-950); --sub: var(--ink-600); --chip: var(--ink-50); --chipB: var(--ink-200); --grid: rgba(10,10,10,.055); }
.abs { position: absolute; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px), linear-gradient(to bottom, var(--grid) 1px, transparent 1px); background-size: 40px 40px; }
.glow { position: absolute; right: -380px; top: -60px; width: 760px; height: 760px; border-radius: 50%;
  background: radial-gradient(circle at 35% 65%, rgba(255,192,0,.30), rgba(255,192,0,.06) 60%, transparent 70%); }
body.claro .glow { background: radial-gradient(circle, rgba(255,192,0,.22), rgba(255,192,0,0) 65%); }
.logo { left: 96px; top: 280px; padding: 22px 30px; border-radius: 26px; background: var(--ink-50); }
body.claro .logo { padding: 0; background: none; }
.logo img { display: block; height: 96px; }
.tag { left: 96px; top: 460px; display: inline-flex; align-items: center; gap: 14px; padding: 14px 28px; border-radius: 999px;
  background: var(--y); color: var(--ink-950); font-weight: 800; font-size: 26px; letter-spacing: .14em; }
h1 { position: absolute; left: 92px; top: 560px; right: 60px; font-weight: 800; font-size: 128px; line-height: 1.0; letter-spacing: -.045em; }
h1 em { font-style: italic; font-weight: 500; }
h1 .y { color: var(--y); }
body.claro h1 .y { color: var(--ink-950); }
body.claro h1 .u { background: linear-gradient(transparent 86%, var(--y) 86%, var(--y) 92%, transparent 92%); }
body.claro .panel { background: var(--ink-950); color: #fff; }
body.claro .panel i { background: var(--y); }
.uline { left: 96px; top: 985px; width: 220px; height: 12px; border-radius: 6px; background: var(--y); }
body.claro .uline { display: none; }
.sub { left: 96px; top: 1030px; font-size: 44px; font-weight: 500; color: var(--sub); letter-spacing: -.01em; }
.chip { position: absolute; padding: 18px 28px; border-radius: 16px; background: var(--chip); border: 1.5px solid var(--chipB);
  font-weight: 700; font-size: 32px; display: flex; align-items: center; gap: 12px; color: var(--fg); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
body.claro .chip { box-shadow: 0 16px 40px rgba(10,10,10,.08); }
.bdg { display: inline-grid; place-items: center; min-width: 38px; height: 38px; padding: 0 10px; border-radius: 19px; background: var(--y); color: var(--ink-950); font-size: 21px; font-weight: 800; }
.arrow { left: 520px; top: 1345px; }
.panel { left: 96px; right: 96px; top: 1435px; height: 104px; border-radius: 20px; background: var(--y); color: var(--ink-950);
  display: flex; align-items: center; justify-content: center; gap: 22px; font-weight: 800; font-size: 40px; letter-spacing: .02em; }
.web { left: 96px; top: 1600px; font-weight: 700; font-size: 28px; letter-spacing: .2em; color: var(--sub); }
.panel i { width: 20px; height: 20px; border-radius: 50%; background: var(--ink-950); }
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<div class="abs logo"><img src="../../assets_in/brand-kit/assets/logo-imperios-navbar.svg" alt="ImperiOS"></div>
<div class="abs tag">CRM PARA INMOBILIARIAS</div>
<h1>¿Cansado de usar <em class="y">diferentes <span class="u">herramientas?</span></em></h1>
<div class="abs uline"></div>
<div class="abs sub">Para gestionar tu inmobiliaria.</div>
<!-- el caos de herramientas… -->
<div class="chip" style="left:96px;top:1140px;transform:rotate(-5deg)">Portales<span class="bdg">3</span></div>
<div class="chip" style="left:372px;top:1122px;transform:rotate(3deg)">WhatsApp<span class="bdg">12</span></div>
<div class="chip" style="left:710px;top:1148px;transform:rotate(-3deg)">Excel</div>
<div class="chip" style="left:150px;top:1250px;transform:rotate(4deg)">Email<span class="bdg">7</span></div>
<div class="chip" style="left:420px;top:1242px;transform:rotate(-4deg)">Llamadas</div>
<div class="chip" style="left:722px;top:1256px;transform:rotate(5deg)">Web</div>
<!-- …en un solo panel -->
<svg class="abs arrow" width="40" height="70" viewBox="0 0 40 70"><path d="M20 2v60M6 48l14 14 14-14" stroke="#FFD500" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="abs panel"><i></i>TODO EN UN SOLO SITIO</div>
<div class="abs web">IMPERIOS.APP</div>
<script>
if (new URLSearchParams(location.search).get('tema') === 'claro') document.body.classList.add('claro');
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => i.onload = r))));
</script>
</body>
</html>
