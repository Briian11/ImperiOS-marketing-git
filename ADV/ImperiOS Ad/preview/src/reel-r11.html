<!doctype html>
<html lang="es">
<head>

<title>Reel R11 — Falso interés</title>
<!-- Motor del Reel orgánico R11 (calificación con IA), 1080×1920, formato «criba» en oscuro.
     Gancho con avisos de mensajes → avalancha (20, 30, 50 al día) → bandeja sin filtrar con el interesado enterrado →
     la IA hace a cada contacto unas preguntas (capas del filtro): los curiosos se quedan, pasan los interesados →
     curiosos / templados / interesados → «Prioridad de hoy» con «Llamar» → cierre + Comenta DEMO.
     Chat genérico (no copia de ninguna app), datos de ejemplo. Tiempos: timeline-r11.json (build_timeline_r11.py). -->
<style>
@font-face { font-family: "Manrope"; src: url("manrope-latin-variable.woff2") format("woff2"); font-weight: 200 800; }
:root { --ink-950:#0A0A0A; --ink-900:#1C1C1C; --ink-850:#242424; --ink-800:#333; --ink-700:#4A4A4A; --ink-600:#727272; --ink-500:#B0B0B0;
  --ink-200:#EBEBEB; --ink-50:#FAFAFA; --y:#FFD500; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body { font-family: "Manrope", sans-serif; -webkit-font-smoothing: antialiased; position: relative; background: var(--ink-950); color: #fff; }
.abs { position: absolute; }
#grid { position: absolute; inset: -80px; background-image: linear-gradient(to right, rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 40px 40px; }
#glow { left: 540px; top: 860px; width: 1300px; height: 1300px; margin: -650px 0 0 -650px; border-radius: 50%; background: radial-gradient(circle, rgba(255,192,0,.11), rgba(255,192,0,0) 60%); }
.lbl { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 24px; letter-spacing: .16em; white-space: nowrap; }
.lbl i { width: 36px; height: 6px; border-radius: 3px; background: var(--y); }
#topH { left: 72px; right: 72px; top: 280px; display: flex; justify-content: space-between; align-items: center; }
#topH img { height: 52px; display: block; }
#topH span { font-weight: 800; font-size: 22px; letter-spacing: .16em; color: var(--ink-500); }
#topM { left: 72px; right: 72px; top: 286px; display: flex; justify-content: space-between; align-items: center; }
#topM .r { font-weight: 800; font-size: 20px; letter-spacing: .16em; color: var(--ink-600); }
.k { position: absolute; left: 72px; right: 60px; font-weight: 800; letter-spacing: -.045em; line-height: 1.04; }
.k .w { display: inline-block; }
.k .it { font-style: italic; font-weight: 500; color: var(--y); }
#kh { top: 420px; font-size: 90px; }
/* avisos del gancho */
.nt { position: absolute; left: 72px; width: 936px; height: 112px; border-radius: 26px; background: var(--ink-900); border: 1.5px solid var(--ink-800);
  display: flex; align-items: center; gap: 20px; padding: 0 26px; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
.nt .ic { width: 60px; height: 60px; border-radius: 16px; background: var(--ink-800); display: grid; place-items: center; flex: none; }
.nt b { display: block; font-size: 22px; letter-spacing: .1em; color: var(--ink-500); }
.nt span { font-weight: 700; font-size: 30px; }
.nt small { margin-left: auto; font-weight: 700; font-size: 20px; color: var(--ink-600); }
/* avalancha */
#cnt { left: 0; right: 0; top: 400px; text-align: center; }
#cnt b { display: block; font-weight: 800; font-size: 240px; letter-spacing: -.06em; line-height: 1; color: var(--y); }
#cnt span { font-weight: 800; font-size: 26px; letter-spacing: .2em; color: var(--ink-500); }
.bb { position: absolute; left: 0; top: 0; padding: 14px 22px; border-radius: 24px; border-bottom-left-radius: 6px; background: var(--ink-800); font-weight: 700; font-size: 28px; white-space: nowrap; }
.bb small { display: block; font-size: 15px; font-weight: 800; letter-spacing: .12em; color: var(--ink-500); margin-bottom: 2px; }
/* bandeja */
#inbox { left: 72px; width: 936px; top: 470px; height: 720px; border-radius: 34px; background: var(--ink-900); border: 1.5px solid var(--ink-800); overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,.6); }
#inbox .ph { position: absolute; left: 0; right: 0; top: 0; height: 90px; padding: 0 32px; display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 20px; letter-spacing: .16em; color: var(--ink-500); background: var(--ink-850); border-bottom: 1.5px solid var(--ink-800); z-index: 3; }
#inbox .ph b { margin-left: auto; font-size: 22px; color: #fff; background: var(--ink-700); padding: 6px 14px; border-radius: 999px; letter-spacing: 0; }
.ir { position: absolute; left: 20px; right: 20px; height: 86px; border-radius: 18px; display: flex; align-items: center; gap: 18px; padding: 0 20px; }
.ir .a { width: 50px; height: 50px; border-radius: 50%; background: var(--ink-800); display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
.ir .tx { font-weight: 600; font-size: 25px; color: var(--ink-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ir .ok { margin-left: auto; font-weight: 800; font-size: 17px; letter-spacing: .1em; color: var(--ink-600); white-space: nowrap; }
#hot { position: absolute; left: 20px; right: 20px; height: 120px; border-radius: 22px; background: #2B260E; border: 2px solid var(--y); display: flex; align-items: center; gap: 18px; padding: 0 22px; z-index: 2; }
#hot .a { width: 60px; height: 60px; border-radius: 50%; background: var(--y); color: var(--ink-950); display: grid; place-items: center; font-weight: 800; font-size: 20px; flex: none; }
#hot .tx { font-weight: 700; font-size: 27px; line-height: 1.25; }
#hot .wt { margin-left: auto; text-align: right; font-weight: 800; font-size: 17px; letter-spacing: .1em; color: var(--y); white-space: nowrap; }
#hot .wt b { display: block; font-size: 30px; letter-spacing: 0; color: #fff; }
/* filtro */
.layer { position: absolute; left: 72px; right: 72px; height: 0; }
.layer .q { position: absolute; left: 0; top: -30px; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 20px 0 12px; border-radius: 16px; background: var(--ink-50); color: var(--ink-950); font-weight: 800; font-size: 22px; white-space: nowrap; box-shadow: 0 14px 30px rgba(0,0,0,.4); }
.layer .q i { width: 38px; height: 38px; border-radius: 11px; background: var(--ink-950); color: var(--y); display: grid; place-items: center; font-style: normal; font-size: 15px; letter-spacing: .02em; }
.layer .bar { position: absolute; left: 350px; right: 0; top: -3px; height: 6px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--ink-600) 0 18px, transparent 18px 30px); }
.ct { position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px; border-radius: 50%; background: var(--ink-500); display: grid; place-items: center; font-weight: 800; font-size: 15px; color: var(--ink-950); }
#tray { left: 422px; right: 72px; top: 1160px; height: 0; border-top: 3px solid var(--y); }
.ch { position: absolute; width: 300px; margin-left: -150px; text-align: center; top: 520px; }
.ch b { display: block; font-weight: 800; font-size: 26px; letter-spacing: .14em; }
.ch span { display: block; font-weight: 800; font-size: 76px; letter-spacing: -.04em; margin-top: 4px; }
/* prioridad */
#prio { left: 72px; width: 936px; top: 500px; height: 640px; border-radius: 34px; background: var(--ink-50); color: var(--ink-950); padding: 32px 30px; box-shadow: 0 40px 100px rgba(0,0,0,.6); }
#prio .ph { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 22px; letter-spacing: .16em; color: var(--ink-600); }
#prio .ph i { width: 12px; height: 12px; border-radius: 50%; background: var(--y); }
.pr { position: absolute; left: 30px; right: 30px; height: 160px; border-radius: 24px; background: #fff; border: 1.5px solid var(--ink-200); display: flex; align-items: center; gap: 20px; padding: 0 24px; }
.pr .a { width: 66px; height: 66px; border-radius: 50%; background: var(--y); display: grid; place-items: center; font-weight: 800; font-size: 22px; flex: none; }
.pr .nm { font-weight: 800; font-size: 31px; }
.pr .tg { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.pr .tg span { font-weight: 700; font-size: 18px; padding: 6px 10px; border-radius: 9px; background: var(--ink-200); white-space: nowrap; }
.pr .cl { margin-left: auto; height: 64px; padding: 0 26px; border-radius: 18px; background: var(--ink-950); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 25px; white-space: nowrap; flex: none; }
.pr .cl span { grid-area: 1 / 1; }
#cursor { left: 0; top: 0; width: 60px; height: 60px; z-index: 30; filter: drop-shadow(0 10px 20px rgba(0,0,0,.5)); }
/* subtítulos */
#sub { left: 72px; right: 72px; top: 1300px; font-weight: 800; font-size: 54px; letter-spacing: -.03em; line-height: 1.1; }
#sub .w { display: inline-block; }
#sub .hl { font-style: italic; font-weight: 500; color: var(--y); }
/* cierre */
#kq { top: 470px; font-size: 88px; }
#logo { left: 50%; top: 860px; width: 470px; margin-left: -235px; }
#cta { left: 50%; top: 1080px; transform: translateX(-50%); }
#cta div { height: 112px; padding: 0 56px; border-radius: 999px; background: var(--y); color: var(--ink-950); display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 40px; white-space: nowrap; }
#web { left: 0; right: 0; top: 1230px; text-align: center; font-weight: 800; font-size: 26px; letter-spacing: .2em; color: var(--ink-500); }
</style>
</head>
<body>
<div id="grid"></div>
<div class="abs" id="glow"></div>

<!-- GANCHO -->
<div id="hook">
  <div class="abs" id="topH"><img src="../../assets_in/brand-kit/assets/logo-imperios-navbar-blanco.svg" alt="ImperiOS"><span>CRM PARA INMOBILIARIAS</span></div>
  <div class="k" id="kh"></div>
  <div id="nts"></div>
</div>
<div class="abs" id="topM"><span class="lbl"><i></i>CALIFICACIÓN CON IA</span><span class="r">DATOS DE EJEMPLO</span></div>

<!-- AVALANCHA -->
<div id="aScene"><div id="bbs"></div><div class="abs" id="cnt"><b id="cntN">20</b><span>MENSAJES HOY · DESDE LOS PORTALES</span></div></div>

<!-- BANDEJA -->
<div class="abs" id="inbox"><div class="ph">BANDEJA · SIN FILTRAR<b id="ibN">50</b></div><div id="irs"></div>
  <div id="hot"><span class="a">LM</span><div class="tx">«Quiero verlo esta semana.<br>Tengo la hipoteca aprobada.»</div><div class="wt">ESPERANDO<b id="hotT">0 min</b></div></div>
</div>

<!-- FILTRO -->
<div id="fScene">
  <div id="layers"></div>
  <div class="abs" id="tray"></div>
  <div id="cts"></div>
  <div class="ch" id="ch0" style="left:230px"><b style="color:var(--ink-500)">CURIOSOS</b><span id="chN0" style="color:var(--ink-500)">0</span></div>
  <div class="ch" id="ch1" style="left:540px"><b>TEMPLADOS</b><span id="chN1">0</span></div>
  <div class="ch" id="ch2" style="left:850px"><b style="color:var(--y)">INTERESADOS</b><span id="chN2" style="color:var(--y)">0</span></div>
</div>

<!-- PRIORIDAD -->
<div class="abs" id="prio"><div class="ph"><i></i>PRIORIDAD DE HOY · LLAMA PRIMERO A</div><div id="prs"></div></div>

<div class="abs" id="sub"></div>

<!-- CIERRE -->
<div class="k" id="kq"></div>
<img class="abs" id="logo" src="../../assets_in/brand-kit/assets/logo-imperios-navbar-blanco.svg" alt="ImperiOS">
<div class="abs" id="cta"><div><span id="ctaLbl">Comenta DEMO</span> <svg width="34" height="34" viewBox="0 0 34 34"><path d="M9 25L25 9M12 9h13v13" stroke="#0A0A0A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
<div class="abs" id="web">IMPERIOS.APP</div>

<svg class="abs" id="cursor" viewBox="0 0 60 60"><path d="M10 6l36 22-16 3-8 15z" fill="#fff" stroke="#0A0A0A" stroke-width="3" stroke-linejoin="round"/></svg>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const E = {
  oc: p => 1 - Math.pow(1 - p, 3), ic: p => p * p * p,
  ioc: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  ob: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  ob2: p => { const c1 = 2.4, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
};
const k = (t, t0, t1, e = E.oc) => e(clamp((t - t0) / (t1 - t0)));
const css = (el, o) => { for (const key in o) el.style[key] = o[key]; };
const show = (el, p, dy = 60, extra = '') => css(el, { opacity: p, transform: `translateY(${(1 - p) * dy}px) ${extra}`, filter: p < .98 ? `blur(${(1 - p) * 10}px)` : 'none' });
const lerp = (a, b, p) => a + (b - a) * p;

let B = { h: [.3, 3.6], a: [4.5, 5.2, 5.8, 6.3, 9, 10.6], b: [11.3, 12.9, 13.8, 15.3, 16.5], f: [17.2, 18.3, 20, 20.8, 21.8], c: [22.8, 23.9, 25], p: [26.3, 26.6, 27.9, 28.2], q: [29.1, 31.9], logo: 31.6, end: 36.5, wt: {}, sub: [], dings: [] };
window.setBeats = b => {
  B = Object.assign(B, b);
  if (B.ctaLbl) $('#ctaLbl').textContent = B.ctaLbl;   // texto del botón (por defecto «Comenta DEMO»)
  if (B.ctaSub) $('#web').innerHTML = B.ctaSub;        // línea bajo el botón (por defecto «IMPERIOS.APP»)
};
window.setVariant = () => {};

function block(el, lines) {
  el.innerHTML = ''; const out = [];
  lines.forEach((ln, li) => {
    ln.forEach(([txt, cls]) => { const s = document.createElement('span'); s.className = 'w' + (cls ? ' ' + cls : ''); s.textContent = txt; el.appendChild(s); out.push(s); el.appendChild(document.createTextNode(' ')); });
    if (li < lines.length - 1) el.appendChild(document.createElement('br'));
  });
  return out;
}
const KH = block($('#kh'), [[['¿Tu'], ['equipo'], ['pierde']], [['la'], ['mañana'], ['contestando']], [['a'], ['gente'], ['que'], ['solo']], [['pregunta'], ['por', 'it'], ['preguntar?', 'it']]]);
const KQ = block($('#kq'), [[['¿Cuánto'], ['tiempo'], ['pierde']], [['tu'], ['equipo'], ['con'], ['el']], [['falso', 'it'], ['interés?', 'it']]]);
function words(ws, t, t0, wt) { ws.forEach((w, j) => { const p = k(t - t0, wt[j] ?? j * .1, (wt[j] ?? j * .1) + .3); css(w, { opacity: p, transform: `translateY(${(1 - p) * 40}px)`, filter: p < 1 ? `blur(${(1 - p) * 9}px)` : 'none' }); }); }
const IC = '<svg width="30" height="30" viewBox="0 0 30 30"><path d="M5 7h20v13H12l-6 5v-5H5z" fill="none" stroke="#FFD500" stroke-width="2.6" stroke-linejoin="round"/></svg>';

// gancho: 3 avisos que se apilan
const NT = [['¿Sigue disponible?', 'ahora'], ['Info', 'ahora'], ['¿Precio final?', 'ahora']];
$('#nts').innerHTML = NT.map(([m, w], i) => `<div class="nt" id="nt${i}">${'<span class="ic">' + IC + '</span>'}<div><b>PORTAL · NUEVO MENSAJE</b><span>${m}</span></div><small>${w}</small></div>`).join('');

// avalancha de burbujas (posición pura del tiempo)
const MSG = ['¿Sigue disponible?', 'Info', '¿Precio?', 'Hola', '¿Se puede ver?', 'Ok gracias', '¿Aceptan mascotas?', 'Info pls', '¿Tiene garaje?', '¿Es negociable?', 'Me interesa', '¿Fotos?', '¿Dónde está?', 'Hola, info', '¿Gastos?'];
const BBS = [];
for (let j = 0; j < 60; j++) { const el = document.createElement('div'); el.className = 'bb'; el.innerHTML = `<small>PORTAL</small>${MSG[j % MSG.length]}`; $('#bbs').appendChild(el); BBS.push({ el, x: 60 + ((j * 397) % 760), r: ((j * 53) % 14) - 7, sp: 520 + (j * 71) % 260 }); }

// bandeja: filas grises que suben; el interesado queda abajo
const IR = ['¿Sigue disponible?', 'Info', '¿Precio final?', 'Hola, ¿se puede ver?', 'Ok, gracias', '¿Aceptan mascotas?', 'Info pls', '¿Es negociable?', '¿Tiene garaje?', 'Me lo pienso', '¿Gastos de comunidad?', 'Hola'];
$('#irs').innerHTML = IR.map((m, i) => `<div class="ir" id="ir${i}"><span class="a">${'ABCDEFGHJKLMNP'[i]}${'RSTVMGLPRSTV'[i]}</span><span class="tx">${m}</span><span class="ok">✓ RESPONDIDO</span></div>`).join('');

// filtro: 4 preguntas de la IA; 30 contactos, cada uno se queda en una capa o pasa
const LY = [560, 700, 840, 980], TRAY = 1160;
const Q = ['¿Qué presupuesto tienes?', '¿Para cuándo lo buscas?', '¿En qué zona?', '¿Necesitas financiación?'];
$('#layers').innerHTML = LY.map((y, i) => `<div class="layer" id="ly${i}" style="top:${y}px"><span class="q"><i>IA</i>${Q[i]}</span><span class="bar"></span></div>`).join('');
const STOP = [0, 1, 0, 2, 0, 1, 3, 0, 2, 1, 4, 0, 1, 3, 2, 0, 1, 2, 3, 4, 0, 1, 2, 3, 0, 1, 3, 2, 4, 1];   // 4 = pasa
const CTS = [], lane = [0, 0, 0, 0, 0];
STOP.forEach((s, j) => { const el = document.createElement('div'); el.className = 'ct'; el.textContent = ['AM', 'LG', 'JR', 'SP', 'MR', 'DV', 'CT', 'PL', 'RS', 'BV'][j % 10]; $('#cts').appendChild(el);
  const n = lane[s]++; CTS.push({ el, s, j, x: s === 4 ? 620 + n * 120 : 450 + n * 66 + (s % 2) * 20 }); });
const cls = c => c.s === 4 ? 2 : c.s === 3 ? 1 : 0;   // 0 curiosos · 1 templados · 2 interesados
const colPos = (() => { const n = [0, 0, 0]; return CTS.map(c => { const g = cls(c), i = n[g]++; const cx = [230, 540, 850][g]; return [cx + ((i % 4) - 1.5) * 56, 690 + Math.floor(i / 4) * 56]; }); })();
const PASS = CTS.filter(c => c.s === 4);

// prioridad
const PR = [['LM', 'L. M. · Ático Chamberí', ['Hasta 420.000 €', 'Este mes', 'Hipoteca aprobada']], ['AR', 'A. R. · Piso Retiro', ['Hasta 350.000 €', 'En 2 meses', 'Zona Retiro']], ['JS', 'J. S. · Chalet Pozuelo', ['Hasta 700.000 €', 'Este trimestre', 'Sin financiación']]];
$('#prs').innerHTML = PR.map(([a, n, tg], i) => `<div class="pr" id="pr${i}" style="top:${96 + i * 176}px"><span class="a">${a}</span><div><div class="nm">${n}</div><div class="tg">${tg.map(x => `<span>✓ ${x}</span>`).join('')}</div></div><div class="cl"><span class="c0">Llamar</span><span class="c1" style="opacity:0">Llamando…</span></div></div>`).join('');

function cursorAt(x, y, press = 0) { css($('#cursor'), { transform: `translate(${x - 10}px, ${y - 6}px) scale(${1 - .15 * press})` }); }

function render(t) {
  const [h0, h1] = B.h, [a0, a1, a2, a3, a4, a5] = B.a, [b0, b1, b2, b3, b4] = B.b, [f0, f1, f2, f3, f4] = B.f, [c0, c1, c2] = B.c, [p0, p1, p2, p3] = B.p, [q0, q1] = B.q;
  css($('#grid'), { transform: `translate(${(-t * 6) % 40}px, ${(-t * 9) % 40}px)` });
  const D = B.dings || [];

  // ---------- GANCHO ----------
  const hOut = k(t, a0 - .35, a0 + .05, E.ic);
  css($('#hook'), { display: t < a0 + .1 ? 'block' : 'none', opacity: 1 - hOut, transform: `translateY(${-hOut * 60}px)`, filter: hOut > 0 ? `blur(${hOut * 12}px)` : 'none' });
  css($('#topH'), { opacity: k(t, 0, .35) });
  words(KH, t, h0, B.wt.h || []);
  NT.forEach((_, i) => {
    const ti = D[i] ?? (h0 + .5 + i), p = k(t, ti - .05, ti + .35, E.ob), newer = NT.filter((_, j) => j > i && t > (D[j] ?? 99) - .05).length;
    const sh = t > ti ? Math.sin((t - ti) * 60) * 6 * Math.exp(-(t - ti) * 8) : 0;
    css($('#nt' + i), { top: (1000 + newer * 130) + 'px', opacity: k(t, ti - .05, ti + .1) * (1 - newer * .25), transform: `translateY(${(1 - p) * -80}px) translateX(${sh}px) scale(${1 - newer * .04})`, zIndex: 10 - newer, transition: 'none' });
  });

  // ---------- AVALANCHA ----------
  const av = t > a0 - .1 && t < b0 + .4, aOut = k(t, b0 - .2, b0 + .3, E.ic);
  css($('#aScene'), { display: av ? 'block' : 'none', opacity: 1 - aOut, filter: aOut > 0 ? `blur(${aOut * 10}px)` : 'none' });
  const n = t < a2 ? 20 : t < a3 ? 30 : 50, last = t < a2 ? a1 : t < a3 ? a2 : a3;
  $('#cntN').textContent = n;
  const cp = k(t, last, last + .35, E.ob2);
  css($('#cnt'), { opacity: k(t, a1 - .1, a1 + .1), transform: `scale(${.85 + .15 * cp})` });
  const dim = k(t, a4, a4 + .8);
  BBS.forEach((bb, j) => {
    const ts = D[3 + j] ?? (a0 + j * .2), age = t - ts, live = age > 0 && age < 2.6 && ts < a5;
    css(bb.el, { display: live ? 'block' : 'none' });
    if (!live) return;
    const y = 680 + bb.sp * age + 60 * age * age;
    css(bb.el, { transform: `translate(${bb.x}px, ${y}px) rotate(${bb.r}deg) scale(${k(t, ts, ts + .2, E.ob2)})`, opacity: (1 - k(y, 1020, 1230)) * (1 - .65 * dim) });
  });

  // ---------- BANDEJA ----------
  const iv = t > b0 - .05 && t < f0 + .5, iIn = k(t, b0, b0 + .5, E.ob), iOut = k(t, f0 - .15, f0 + .3, E.ic);
  css($('#inbox'), { display: iv ? 'block' : 'none', opacity: k(t, b0, b0 + .2) * (1 - iOut), transform: `translateY(${(1 - iIn) * 120}px) scale(${1 - .1 * iOut})`, filter: iOut > 0 ? `blur(${iOut * 10}px)` : 'none' });
  const scroll = Math.max(0, t - b0) * 95;
  IR.forEach((_, i) => {
    const y = 110 + i * 96 - (scroll % (IR.length * 96) > (i + 1) * 96 ? 0 : 0) - scroll;
    const yy = ((y - 110) % (IR.length * 96) + IR.length * 96) % (IR.length * 96) + 110 - 96;
    css($('#ir' + i), { top: yy + 'px' });
    const ok = $('#ir' + i).querySelector('.ok');
    css(ok, { opacity: t > b1 - .6 + i * .08 ? 1 : 0 });
  });
  const hp = k(t, b3 - .3, b3 + .2, E.ob), pulse = t > b4 ? .5 + .5 * Math.sin((t - b4) * 8) : 0;
  css($('#hot'), { top: (720 - 140) + 'px', opacity: hp, transform: `translateY(${(1 - hp) * 60}px) scale(${1 + .02 * pulse})`, boxShadow: `0 0 ${50 * pulse}px rgba(255,213,0,${.45 * pulse})` });
  const mins = Math.floor(lerp(12, 134, k(t, b3, f0, p => p)));
  $('#hotT').textContent = mins < 60 ? `${mins} min` : `${Math.floor(mins / 60)} h ${String(mins % 60).padStart(2, '0')} min`;

  // ---------- FILTRO ----------
  const fv = t > f0 - .05 && t < p0 + .5;
  css($('#fScene'), { display: fv ? 'block' : 'none' });
  const cOn = k(t, c0, c0 + .7, E.ioc), pOut = k(t, p0 - .1, p0 + .35, E.ic);
  LY.forEach((_, i) => {
    const p = k(t, f1 + i * .25, f1 + .4 + i * .25, E.ob);
    css($('#ly' + i), { opacity: k(t, f1 + i * .25, f1 + .1 + i * .25) * (1 - cOn), transform: `translateX(${(1 - p) * -80}px)` });
  });
  css($('#tray'), { opacity: k(t, f1 + 1, f1 + 1.3) * (1 - cOn) });
  CTS.forEach((c, j) => {
    const ts = f2 - .3 + j * .085, age = t - ts;
    const yStop = c.s === 4 ? TRAY - 26 : LY[c.s] - 26;
    const y0 = 440, tFall = Math.sqrt((yStop - y0) / 900);
    let x = c.x, y = y0 + 900 * Math.min(age, tFall) ** 2;
    const landed = age >= tFall, col = cls(c);
    if (landed) { const b = Math.sin(k(age - tFall, 0, .25) * Math.PI) * 10; y = yStop - b; }
    // a columnas
    const [cx, cy] = colPos[j], cm = k(t, c0 + (j % 10) * .03, c0 + .7 + (j % 10) * .03, E.ioc);
    x = lerp(x, cx, cm); y = lerp(y, cy, cm);
    // los interesados van a la tarjeta de prioridad
    let op = age > 0 ? 1 : 0;
    op *= col === 2 ? 1 - pOut : 1 - pOut;
    const bg = !landed ? 'var(--ink-500)' : col === 2 ? 'var(--y)' : col === 1 ? '#fff' : 'var(--ink-700)';
    css(c.el, { opacity: op, transform: `translate(${x}px, ${y}px) scale(${landed && col === 2 ? 1.15 : 1})`, background: bg, color: col === 0 && landed ? 'var(--ink-500)' : 'var(--ink-950)',
      boxShadow: landed && col === 2 ? '0 0 30px rgba(255,192,0,.7)' : 'none' });
  });
  const counts = [0, 0, 0]; CTS.forEach(c => counts[cls(c)]++);
  [0, 1, 2].forEach(i => {
    const tt = i === 0 ? c1 : i === 2 ? c2 : c1 + .5, p = k(t, tt - .1, tt + .3, E.ob2);
    css($('#ch' + i), { opacity: k(t, c0 + .3, c0 + .6) * (1 - pOut), transform: `scale(${t > tt - .1 ? .85 + .15 * p : .85})` });
    $('#chN' + i).textContent = Math.round(counts[i] * k(t, c0 + .3, c0 + 1, p => p));
  });

  // ---------- PRIORIDAD ----------
  const pv = t > p0 - .05 && t < q0 + .4, prIn = k(t, p0 + .1, p0 + .6, E.ob), pEnd = k(t, q0 - .3, q0 + .1, E.ic);
  css($('#prio'), { display: pv ? 'block' : 'none', opacity: k(t, p0 + .1, p0 + .3) * (1 - pEnd), transform: `translateY(${(1 - prIn) * 120}px)`, filter: pEnd > 0 ? `blur(${pEnd * 10}px)` : 'none' });
  PR.forEach((_, i) => {
    const a = k(t, p0 + .3 + i * .15, p0 + .7 + i * .15, E.ob);
    css($('#pr' + i), { opacity: k(t, p0 + .3 + i * .15, p0 + .45 + i * .15), transform: `translateX(${(1 - a) * 80}px)`, borderColor: i === 0 && t > p3 ? 'var(--y)' : '', boxShadow: i === 0 && t > p3 ? '0 0 0 4px rgba(255,213,0,.5)' : 'none' });
  });
  const press = Math.sin(k(t, p3 - .06, p3 + .14) * Math.PI), cl = $('#pr0 .cl');
  css(cl, { transform: `scale(${1 - .06 * press})`, background: t > p3 + .2 ? 'var(--y)' : '', color: t > p3 + .2 ? 'var(--ink-950)' : '' });
  css(cl.querySelector('.c0'), { opacity: 1 - k(t, p3 + .2, p3 + .3) });
  css(cl.querySelector('.c1'), { opacity: k(t, p3 + .25, p3 + .4) });
  let cv = 0, cx = 1150, cy = 1500;
  if (t > p0) { const a = k(t, p0 + .7, p3 - .1, E.ioc); cx = lerp(1150, 900, a); cy = lerp(1500, 690, a); cv = k(t, p0 + .7, p0 + .9) * (1 - k(t, p3 + .6, p3 + .9)); }
  cursorAt(cx, cy, press); css($('#cursor'), { opacity: cv });

  css($('#topM'), { display: t > a0 - .1 && t < q0 ? 'flex' : 'none', opacity: k(t, a0, a0 + .4) * (1 - k(t, q0 - .3, q0)) });

  // ---------- SUBTÍTULOS ----------
  const SB = B.sub || [];
  let si = -1; SB.forEach((s, j) => { if (t >= s.s) si = j; });
  const sEl = $('#sub');
  if (si !== sEl._i) { sEl._i = si; sEl.innerHTML = ''; sEl._w = si >= 0 ? SB[si].w.map(([tx, , hl]) => { const s = document.createElement('span'); s.className = 'w' + (hl ? ' hl' : ''); s.textContent = tx; sEl.appendChild(s); sEl.appendChild(document.createTextNode(' ')); return s; }) : []; }
  if (si >= 0) {
    const s = SB[si], nx = SB[si + 1] ? SB[si + 1].s : 1e9, end = Math.min(s.e + .5, nx, q0 - .1);
    css(sEl, { opacity: k(t, s.s, s.s + .12) * (1 - k(t, end - .12, end)) });
    sEl._w.forEach((w, j) => { const p = k(t, s.w[j][1] - .06, s.w[j][1] + .14); css(w, { opacity: .28 + .72 * p, transform: `translateY(${(1 - p) * 10}px)` }); });
  } else css(sEl, { opacity: 0 });

  // ---------- CIERRE ----------
  const cv2 = t > q0 - .1;
  [$('#kq'), $('#logo'), $('#cta'), $('#web')].forEach(el => css(el, { display: cv2 ? '' : 'none' }));
  words(KQ, t, q0, B.wt.q || []);
  const lg = k(t, B.logo, B.logo + .5, E.ob);
  css($('#logo'), { opacity: k(t, B.logo, B.logo + .2), transform: `scale(${.85 + .15 * lg})`, filter: lg < .98 ? `blur(${(1 - lg) * 10}px)` : 'none' });
  const cb = k(t, q1 + .2, q1 + .55, E.ob2), pu = t > q1 + .9 ? 1 + .04 * Math.sin((t - q1 - .9) * 6) : 1;
  css($('#cta'), { opacity: k(t, q1 + .2, q1 + .35), transform: `translateX(-50%) scale(${(.7 + .3 * cb) * pu})` });
  show($('#web'), k(t, q1 + .5, q1 + .9), 20);
}
window.render = render;
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => i.onload = r))));
